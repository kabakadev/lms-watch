name: lms-watch

on:
  schedule:
    - cron: '7,37 * * * *'   # off the top of the hour, when GitHub is busiest
  workflow_dispatch:

concurrency:
  group: lms-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Africa/Nairobi          # otherwise deadlines would print in UTC
      MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      HC_URL: ${{ secrets.HC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # The scripts keep their memory in ~/.local/state; carry it between runs
      - uses: actions/cache@v4
        with:
          path: ~/.local/state
          key: lms-state-${{ github.run_id }}
          restore-keys: lms-state-

      - name: Deadline reminders
        run: python reminders.py
      - name: New-content watcher
        if: always()
        run: python watcher.py

      - name: Heartbeat
        run: curl -fsS -m 10 --retry 3 "$HC_URL"
      - name: Failure ping
        if: failure()
        run: curl -fsS -m 10 --retry 3 "$HC_URL/fail" || true
